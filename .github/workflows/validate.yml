name: validate-benchmark

on:
  push:
  pull_request:

jobs:
  reference-solutions-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Every reference solution must pass its hidden tests
        run: python run_eval.py --reference
